name: flame
description: A minimalist Flutter game engine, provides a nice set of somewhat independent modules you can choose from.
version: 0.29.3
homepage: https://github.com/flame-engine/flame

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^0.20.1 # Migrated from 0.15.1
  ordered_set: ^5.0.0 # Migrated from 2.0.1
  box2d_flame:
    path: plugin/box2d_flame-0.4.6
  synchronized: ^3.0.0
  convert: ^3.0.0
  flare_flutter: ^3.0.2
  meta: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.9.4

environment:
  sdk: ">=2.12.0 <4.0.0"
  flutter: ">=1.6.0"

flutter:
  uses-material-design: false
